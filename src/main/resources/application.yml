server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

gemini:
  api-key: ${GEMINI_API_KEY:}        # 환경변수로 주입
  model: ${GEMINI_MODEL:gemini-3.1-flash-lite}   # 환경변수로 교체 가능 (예: gemini-3.1-pro-preview)

logging:
  level:
    com.freshinotei: DEBUG
